<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thread & Form | Fashion Demo</title><style>body{margin:0;background:#f8f6f2;color:#2c2523;font:16px system-ui}nav{display:flex;justify-content:space-between;padding:22px 7%;background:white}nav a{color:#333}header{padding:85px 8%;background:linear-gradient(90deg,#371d2de0,#371d2d66),url('https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1400') center/cover;color:white}h1{font:clamp(44px,6vw,76px) Georgia}main{max-width:1100px;margin:auto;padding:35px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.card{background:white;border-radius:13px;overflow:hidden}.card img{width:100%;height:220px;object-fit:cover}.info{padding:18px}button{border:0;background:#692a49;color:white;padding:12px 18px;border-radius:6px;cursor:pointer;margin:4px}select{padding:11px}footer{text-align:center;padding:30px;background:#331c2b;color:white}</style><nav><b>THREAD & FORM</b><a href="../">All Demos</a></nav><header><h1>Wear Your Story</h1><p>Contemporary clothing for everyday confidence.</p></header><main><h2>Shop the Collection</h2><button onclick="render('all')">All</button><button onclick="render('Women')">Women</button><button onclick="render('Men')">Men</button><button onclick="render('Accessories')">Accessories</button><h3 id="cart">Cart: 0 items · PKR 0</h3><div id="products" class="grid"></div><p><button onclick="alert('Demo checkout only. No payment was processed.')">Demo Checkout</button></p></main><footer>Thread & Form · Demonstration site by Sajawal Gujjar</footer><script>let count=0,sum=0;const products=[['Classic Linen Shirt','Men',3200,'photo-1598032895397-b9472444bf93'],['Everyday Kurti','Women',4100,'photo-1483985988355-763728e1935b'],['Modern Jacket','Men',6900,'photo-1544923246-77307dd654cb'],['Leather Handbag','Accessories',5400,'photo-1548036328-c9fa89d128fa']];function render(cat){document.querySelector('#products').innerHTML=products.filter(x=>cat==='all'||x[1]===cat).map(x=>'<div class="card"><img alt="'+x[0]+'" src="https://images.unsplash.com/'+x[3]+'?w=500"><div class="info"><h3>'+x[0]+'</h3><p>'+x[1]+' · PKR '+x[2]+'</p><select aria-label="Size"><option>S</option><option>M</option><option>L</option><option>XL</option></select><button onclick="add('+x[2]+')">Add to Cart</button></div></div>').join('')}function add(p){count++;sum+=p;document.querySelector('#cart').textContent='Cart: '+count+' items · PKR '+sum}render('all')</script></html>
