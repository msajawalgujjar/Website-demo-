<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olive & Ember | Restaurant Demo</title><style>body{margin:0;background:#fffaf2;color:#27201b;font:16px system-ui}nav{display:flex;justify-content:space-between;padding:20px 7%;background:#241b18;color:white}nav a{color:#fff;text-decoration:none}header{padding:90px 8%;background:linear-gradient(100deg,#281b17dd,#281b1777),url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1400') center/cover;color:white}h1{font:clamp(42px,6vw,76px) Georgia}button{background:#b96832;color:white;border:0;border-radius:7px;padding:13px 20px;cursor:pointer}main{max-width:1050px;margin:auto;padding:30px 20px}section{margin:50px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.card{background:white;border:1px solid #eee1d2;border-radius:14px;padding:22px;box-shadow:0 6px 20px #0001}.filters button{margin:5px;background:#43342b}input,select{padding:12px;margin:6px;border:1px solid #ddd;border-radius:6px}footer{text-align:center;background:#241b18;color:white;padding:30px}</style><nav><b>OLIVE & EMBER</b><a href="../">All Demos</a></nav><header><h1>Good Food. Great Moments.</h1><p>Fresh flavours, warm ambience and memorable dining.</p><a href="#menu"><button>Explore Menu</button></a></header><main><section id="menu"><h2>Our Menu</h2><div class="filters"><button onclick="filter('all')">All</button><button onclick="filter('Mains')">Mains</button><button onclick="filter('Drinks')">Drinks</button><button onclick="filter('Desserts')">Desserts</button></div><div class="grid" id="items"></div><h3 id="cart">Cart: 0 items · PKR 0</h3><button onclick="alert('Demo order only. No order has been placed.')">Demo Checkout</button></section><section><h2>Reserve a Table</h2><form onsubmit="event.preventDefault();alert('Reservation inquiry demo only. No booking has been sent.')"><input required placeholder="Your name"><input required type="date"><input required type="time"><select><option>2 Guests</option><option>4 Guests</option><option>6 Guests</option></select><button>Request Table</button></form></section></main><footer>Olive & Ember · Demonstration site by Sajawal Gujjar</footer><script>let n=0,total=0;const menu=[['Smoky Chicken Platter','Mains',1450],['Signature Beef Burger','Mains',990],['Fresh Lemonade','Drinks',350],['Iced Coffee','Drinks',480],['Chocolate Lava Cake','Desserts',650]];function filter(cat){document.querySelector('#items').innerHTML=menu.filter(x=>cat==='all'||x[1]===cat).map(x=>'<div class="card"><h3>'+x[0]+'</h3><p>'+x[1]+'</p><b>PKR '+x[2]+'</b><p><button onclick="add('+x[2]+')">Add to Cart</button></p></div>').join('')}function add(p){n++;total+=p;document.querySelector('#cart').textContent='Cart: '+n+' items · PKR '+total}filter('all')</script></html>
